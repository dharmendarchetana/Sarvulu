<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you be my Sarvulu?</title>
  <style>
    /* --- Body & Background --- */
    body {
      margin: 0;
      padding: 0;
      background-color: #fff176; /* sunny yellow */
      font-family: 'Comic Sans MS', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Sunflower pattern */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('https://images.unsplash.com/photo-1606788075760-1c87df3d7b4b?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080');
      opacity: 0.15;
      background-repeat: repeat;
      z-index: -1;
    }

    h1 {
      font-size: 2.8rem;
      margin: 20px;
      color: #ff6f00;
      text-shadow: 2px 2px #fff8c6;
    }

    p {
      font-size: 1.3rem;
      margin-bottom: 30px;
      color: #6d4c41;
    }

    #note {
      margin-top: 50px;
      font-size: 1.2rem;
      color: #4e342e;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    /* --- Buttons --- */
    button {
      font-size: 1.2rem;
      padding: 15px 30px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
    }

    #yesBtn {
      background-color: #ffeb3b;
      color: #795548;
    }

    #noBtn {
      background-color: #f06292;
      color: #fff;
    }

    /* --- Chick Animation --- */
    #chick {
      position: absolute;
      bottom: -100px;
      width: 100px;
      transition: bottom 1s ease;
    }

    /* Smooth grow for YES button */
    #yesBtn {
      transform-origin: center;
    }
  </style>
</head>
<body>
  <h1>Will you be my sarvulu in this season of my life?</h1>
  <p>Go on with 👀... try clicking on NO</p>

  <div>
    <button id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
  </div>

  <img id="chick" src="https://media.giphy.com/media/26tn33aiTi1jkl6H6/giphy.gif" alt="chick hatching">

  <div id="note">Let's take it one step at a time ❤️</div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const chick = document.getElementById('chick');
    const note = document.getElementById('note');

    let yesSize = 1;
    const noMessages = [
      "Are you sure?",
      "Reconsider your decision wisely",
      "Think twice!",
      "Come on, YES is fun 😉",
      "No really… think about it!",
      "The right choice is obvious 😏",
      "Last chance to click YES!"
    ];
    let clickCount = 0;

    noBtn.addEventListener('click', () => {
      // Grow the YES button
      yesSize += 0.2;
      yesBtn.style.transform = `scale(${yesSize})`;

      // Cycle NO button text
      if (clickCount < noMessages.length) {
        noBtn.textContent = noMessages[clickCount];
      } else {
        noBtn.textContent = "Can't resist YES 😉";
      }
      clickCount++;

      // Chick pops up slightly
      chick.style.bottom = `${20 + Math.min(clickCount * 10, 60)}px`;
    });

    yesBtn.addEventListener('click', () => {
      alert("Yay! You made the right choice ❤️");
      note.style.opacity = 1;
      // Chick jumps excitedly
      chick.style.bottom = '100px';
      setTimeout(() => {
        chick.style.bottom = '60px';
      }, 500);
    });
  </script>
</body>
</html>
