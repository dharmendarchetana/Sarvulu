<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you be my Sarvulu?</title>
  <!-- Monospace coding font -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Fira Code', monospace;
      background: #fff9c4; /* baby yellow */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
      color: #333;
    }

    /* Sunflower particles */
    .sunflower {
      position: absolute;
      width: 80px;
      animation: sway 5s ease-in-out infinite alternate;
    }

    @keyframes sway {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
      100% { transform: rotate(-5deg); }
    }

    h1 {
      font-size: 2.8rem;
      color: #ff6f00;
      text-shadow: 1px 1px #fff8c6;
      margin: 0 20px;
    }

    p {
      font-size: 1.4rem;
      color: #6d4c41;
      margin-bottom: 30px;
    }

    button {
      font-size: 1.3rem;
      padding: 15px 30px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      font-family: 'Fira Code', monospace;
    }

    #yesBtn {
      background-color: #ffeb3b;
      color: #222;
      transform-origin: center;
    }

    #noBtn {
      background-color: #f06292;
      color: #fff;
    }

    #note {
      margin-top: 50px;
      font-size: 1.2rem;
      color: #4e342e;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    /* Chick hatching animation */
    .egg {
      position: absolute;
      bottom: -80px;
      width: 100px;
      transition: bottom 1s ease;
    }

    .hatched {
      animation: hop 0.5s ease-in-out infinite alternate;
    }

    @keyframes hop {
      0% { transform: translateY(0); }
      100% { transform: translateY(-20px); }
    }
  </style>
</head>
<body>
  <h1>Will you be my sarvulu in this season of my life?</h1>
  <p>Go on with 👀... try clicking on NO</p>

  <div>
    <button id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
  </div>

  <img id="chick" class="egg" src="https://i.imgur.com/7M8d2qK.png" alt="chick hatching">

  <div id="note">Let's take it one step at a time ❤️</div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const chick = document.getElementById('chick');
    const note = document.getElementById('note');

    let yesSize = 1;
    const noMessages = [
      "Are you sure?",
      "Reconsider your decision wisely",
      "Think twice!",
      "Come on, YES is fun 😉",
      "No really… think about it!",
      "The right choice is obvious 😏",
      "Last chance to click YES!"
    ];
    let clickCount = 0;

    // Generate floating sunflowers
    for (let i = 0; i < 8; i++) {
      const sf = document.createElement('img');
      sf.src = 'https://i.imgur.com/4QfKuz1.png'; // sunflower PNG
      sf.classList.add('sunflower');
      sf.style.top = Math.random() * 80 + '%';
      sf.style.left = Math.random() * 90 + '%';
      sf.style.width = 50 + Math.random() * 50 + 'px';
      sf.style.animationDuration = 3 + Math.random() * 4 + 's';
      document.body.appendChild(sf);
    }

    noBtn.addEventListener('click', () => {
      yesSize += 0.2;
      yesBtn.style.transform = `scale(${yesSize})`;

      if (clickCount < noMessages.length) {
        noBtn.textContent = noMessages[clickCount];
      } else {
        noBtn.textContent = "Can't resist YES 😉";
      }
      clickCount++;

      chick.style.bottom = `${20 + Math.min(clickCount * 15, 100)}px`;
    });

    yesBtn.addEventListener('click', () => {
      alert("Yay! You made the right choice ❤️");
      note.style.opacity = 1;
      chick.classList.add('hatched');
    });
  </script>
</body>
</html>
