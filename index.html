<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>For Sarvulu</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      max-width: 340px;
    }

    h1 {
      color: #ff4d6d;
      font-size: 22px;
      line-height: 1.4;
    }

    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 25px;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .no {
      background: #ddd;
      position: relative;
    }

    /* ---------- CAT ANIMATION ---------- */

    .cat {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      position: relative;
      animation: float 2.5s ease-in-out infinite;
    }

    .cat-face {
      width: 60px;
      height: 50px;
      background: #ffd6dc;
      border-radius: 50% 50% 45% 45%;
      position: relative;
    }

    .ear {
      width: 18px;
      height: 18px;
      background: #ffd6dc;
      position: absolute;
      top: -8px;
      border-radius: 4px;
      transform: rotate(45deg);
    }

    .ear.left { left: 6px; }
    .ear.right { right: 6px; }

    .eye {
      width: 6px;
      height: 6px;
      background: #444;
      border-radius: 50%;
      position: absolute;
      top: 22px;
      animation: blink 4s infinite;
    }

    .eye.left { left: 18px; }
    .eye.right { right: 18px; }

    @keyframes blink {
      0%, 95%, 100% { height: 6px; }
      97% { height: 1px; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Animated Cat -->
    <div class="cat">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="cat-face">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>
    </div>

    <h1>
      Will you be my Sarvulu<br>
      in this season of my life?
    </h1>

    <p>
      No pressure — just presence, honesty, and choosing to show up.
    </p>

    <button class="yes" onclick="sayYes()">Yes</button>
    <button class="no" onmouseover="runAway(this)">No</button>

  </div>

  <script>
    function sayYes() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
          font-family:Arial;
          text-align:center;">
          <div style="
            background:white;
            padding:40px;
            border-radius:22px;
            box-shadow:0 12px 30px rgba(0,0,0,0.2);">
            <h1 style="color:#ff4d6d;">Thank you 🤍</h1>
            <p style="color:#555;">
              I’m really glad you’re here.<br>
              We’ll take this gently, one day at a time.
            </p>
          </div>
        </div>
      `;
    }

    function runAway(btn) {
      btn.style.left = Math.random() * 150 + "px";
      btn.style.top = Math.random() * 150 + "px";
    }
  </script>

</body>
</html>
