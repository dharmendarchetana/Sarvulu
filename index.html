<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>For Sarvulu</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      max-width: 340px;
      position: relative;
    }

    h1 {
      color: #ff4d6d;
      font-size: 22px;
      line-height: 1.4;
    }

    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .message {
      color: #ff4d6d;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
      height: 18px;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      position: relative;
      transition: transform 0.05s ease;
    }

    .yes {
      background: #ff4d6d;
      color: white;
      z-index: 2;
    }

    .no {
      background: #ddd;
      z-index: 1;
      position: relative;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>
      Will you be my Sarvulu<br>
      in this season of my life?
    </h1>

    <p class="message">Go on… click No 👀</p>

    <button class="yes" onclick="sayYes()">Yes</button>
    <button class="no">No</button>

  </div>

  <script>
    const yesBtn = document.querySelector('.yes');
    const noBtn = document.querySelector('.no');
    const message = document.querySelector('.message');

    const noMessages = [
      "Are you sure? 😏",
      "Reconsider your decision…",
      "Hmm… really?",
      "Think twice before saying No!",
      "No is not the answer 😉",
      "Why resist the Yes? 😘",
      "This is your chance…"
    ];

    let noClickCount = 0;

    function sayYes() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
          font-family:Arial;
          text-align:center;">
          <div style="
            background:white;
            padding:40px;
            border-radius:22px;
            box-shadow:0 12px 30px rgba(0,0,0,0.2);">
            <h1 style="color:#ff4d6d;">Thank you 🤍</h1>
            <p style="color:#555;">
              I’m really glad you’re here.<br>
              We’ll take this gently, one day at a time.
            </p>
          </div>
        </div>
      `;
    }

    // Each click on NO grows YES and changes message
    noBtn.addEventListener('click', () => {
      // Show next message
      const msg = noMessages[noClickCount % noMessages.length];
      message.textContent = msg;
      noClickCount++;

      // Grow YES
      let currentScale = parseFloat(yesBtn.style.transform.replace(/[^0-9.]/g,'') || 1);
      let newScale = currentScale + 0.5; // bigger growth each click
      if(newScale > 4) newScale = 4; // max size
      yesBtn.style.transform = `scale(${newScale})`;
    });
  </script>

</body>
</html>
