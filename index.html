<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>For Sarvulu</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      max-width: 340px;
      position: relative;
    }

    h1 {
      color: #ff4d6d;
      font-size: 22px;
      line-height: 1.4;
    }

    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 25px;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      position: relative;
      transition: transform 0.05s ease;
    }

    .yes {
      background: #ff4d6d;
      color: white;
      z-index: 2;
    }

    .no {
      background: #ddd;
      z-index: 1;
      position: relative;
    }

    /* ---------- CAT ANIMATION ---------- */
.cat {
  width: 70px;
  height: 70px;
  margin: 0 auto 24px;
  position: relative;
  animation: float 4s ease-in-out infinite;
}

.cat-face {
  width: 70px;
  height: 58px;
  background: #ffd6dc;
  border-radius: 50%;
  position: relative;
  animation: tilt 4s ease-in-out infinite;
}

.ear {
  width: 18px;
  height: 18px;
  background: #ffd6dc;
  position: absolute;
  top: -6px;
  border-radius: 4px;
  transform: rotate(45deg);
}

.ear.left { left: 8px; }
.ear.right { right: 8px; }

.eye {
  width: 6px;
  height: 6px;
  background: #444;
  border-radius: 50%;
  position: absolute;
  top: 26px;
  animation: blink 5s infinite;
}

.eye.left { left: 22px; }
.eye.right { right: 22px; }

.tail {
  width: 22px;
  height: 6px;
  background: #ffd6dc;
  position: absolute;
  bottom: 6px;
  right: -12px;
  border-radius: 10px;
  animation: tail 3s ease-in-out infinite;
}

@keyframes blink {
  0%, 96%, 100% { height: 6px; }
  98% { height: 1px; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@keyframes tilt {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(2deg); }
}

@keyframes tail {
  0%, 100% { transform: rotate(10deg); }
  50% { transform: rotate(-10deg); }
}

  </style>
</head>

<body>

  <div class="card">

    <!-- Animated Cat -->
    <div class="cat">
  <div class="ear left"></div>
  <div class="ear right"></div>
  <div class="cat-face">
    <div class="eye left"></div>
    <div class="eye right"></div>
  </div>
  <div class="tail"></div>
</div>
    <h1>
      Will you be my Sarvulu<br>
      in this season of my life?
    </h1>

    <p>
      Go on… click No 👀 Let’s see how brave you really are.
    </p>

    <button class="yes" onclick="sayYes()">Yes</button>
    <button class="no">No</button>

  </div>

  <script>
    const yesBtn = document.querySelector('.yes');
    const noBtn = document.querySelector('.no');

    // Multiple NO messages
    const noMessages = [
      "Are you sure?",
      "Reconsider your decision wisely",
      "Think twice!",
      "Come on, YES is fun 😉",
      "No really… think about it!",
      "The right choice is obvious 😏",
      "Last chance to click YES!"
    ];
    let clickCount = 0;
    let yesScale = 1;

    function sayYes() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
          font-family:Arial;
          text-align:center;">
          <div style="
            background:white;
            padding:40px;
            border-radius:22px;
            box-shadow:0 12px 30px rgba(0,0,0,0.2);">
            <h1 style="color:#ff4d6d;">Thank you 🤍</h1>
            <p style="color:#555;">
              Yay! You made the right choice ❤️ <br>
              We’ll take one day at a time.
            </p>
          </div>
        </div>
      `;
    }

    // NO button click cycles messages & grows YES button
    noBtn.addEventListener('click', () => {
      if(clickCount < noMessages.length){
        noBtn.textContent = noMessages[clickCount];
      } else {
        noBtn.textContent = "Can't resist YES 😉";
      }
      clickCount++;

      yesScale += 0.2;
      yesBtn.style.transform = `scale(${yesScale})`;
    });

    // Optional: remove the runaway effect if you just want multiple NO messages
    // If you still want the mousemove scaling, you can combine them as well
  </script>

</body>
</html>
